version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: local-pt-db-paisatrack
    restart: unless-stopped
    environment:
      POSTGRES_USER: humbingo
      POSTGRES_PASSWORD: Welcome@1
      POSTGRES_DB: local-pt-db-paisatrack
    ports:
      - "5600:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - postgres_network

volumes:
  postgres_data:
    driver: local

networks:
  postgres_network:
    driver: bridge
